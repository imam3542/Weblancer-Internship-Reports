<h3>Simple Toggle Section</h3>

<button onclick="toggle('sec1')">Section 1</button>
<div id="sec1" style="display:none;">
    <p>This is sample text for section 1.</p>
</div>

<button onclick="toggle('sec2')">Section 2</button>
<div id="sec2" style="display:none;">
    <p>This is sample text for section 2.</p>
</div>

<script>
    function toggle(id){
        let box = document.getElementById(id);
        box.style.display = box.style.display === "none" ? "block" : "none";
    }
</script>
